{% extends 'base.html' %}<!-- Formulário para revisar permissões e dados de um perfil. -->{% block titulo %}Editar perfil{% endblock %}{% block conteudo %}
<div class="page-heading"><div><p class="eyebrow">ADMINISTRAÇÃO</p><h1>Editar perfil</h1><p class="muted">Altere os cadastros liberados para {{ perfil.nome }}.</p></div><a href="{{ url_for('perfis.listar') }}" class="button">Voltar</a></div>
<div class="panel"><form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Nome do perfil<input name="nome" required maxlength="100" value="{{ perfil.nome }}"></label><label class="span-2">Descrição<input name="descricao" maxlength="255" value="{{ perfil.descricao or '' }}"></label><div class="permissions"><strong class="permission-title">Cadastros permitidos</strong>{% for rota, nome in rotas_cadastro.items() %}<label class="check"><input type="checkbox" name="rotas" value="{{ rota }}" {% if rota in rotas_selecionadas %}checked{% endif %}> {{ nome }}</label>{% endfor %}</div><div class="form-actions"><button class="button primary">Salvar alterações</button></div></form></div>
{% endblock %}
